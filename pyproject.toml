[project]
name = "clean-loop"
version = "0.0.0"
description = "Evidence-gated agent orchestration for bounded development work"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.5"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".clean-loop", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
